name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@a5765019912a8ab6882b12db049c7cde635f3a85
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - name: Install Markdown diagram tooling
        run: |
          uv tool install nixie-cli==1.1.0
          cargo install merman-cli --version 0.7.0 --locked
      - name: Spelling
        run: make spelling
      - name: Mermaid diagrams
        run: make nixie
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Cache whitaker-installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install the Whitaker Dylint suite
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          # The repository does not use the Cranelift backend, so the
          # default installer invocation suffices.
          whitaker-installer
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        # Coverage here is for the local ratchet and nothing else. The report
        # is neither archived (`publish-artefact: 'false'`) nor sent to
        # CodeScene: a pull request from a fork cannot read
        # `secrets.CS_ACCESS_TOKEN`, so a CodeScene step here is silently
        # inert for exactly the changes that most need reviewing, and
        # CodeScene accepts an upload only for a branch it analyses, which a
        # pull request head is not. `coverage-main.yml` owns both persistent
        # outputs, and the baseline paths are the action's defaults on both
        # sides, so this ratchet reads the baseline that workflow writes.
        #
        # The Python interpreter for the coverage run is pinned by the
        # repository's .python-version file. Slipcover's line accounting
        # differs between interpreter versions (94.30% on 3.12 vs 91.71% on
        # 3.14 for identical source), so this job and coverage-main must
        # resolve the same Python or the ratchet baseline drifts.
        uses: leynos/shared-actions/.github/actions/generate-coverage@3822201c597078a5ed1939bdf067fe06a3d78a9d
        with:
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'
          publish-artefact: 'false'
