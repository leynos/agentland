name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    # Ubicloud, to avoid the hosted queue: the hosted wait was a median of
    # 2 s but a p90 of 563 s over six runs after 2026-09-24 (jobs API,
    # needs-aware). A pull request from a fork cannot obtain an Ubicloud
    # runner, so it falls back to the hosted pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the
    # warm Ubicloud run of 12.7 min (run 36558912722), rounded up to 30.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          install-mold: 'true'
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Install Markdown diagram tooling
        run: |
          uv tool install nixie-cli==1.1.0
          cargo install merman-cli --version 0.7.0 --locked
      - name: Spelling
        run: make spelling
      - name: Mermaid diagrams
        run: make nixie
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          version: "0.6.1"

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          # The dev profile builds with the Cranelift backend, so the lint suite's
          # toolchain needs rustc-codegen-cranelift too.
          cranelift: 'true'
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        # Coverage here is for the local ratchet and nothing else. The report
        # is neither archived (`publish-artefact: 'false'`) nor sent to
        # CodeScene: a pull request from a fork cannot read
        # `secrets.CS_ACCESS_TOKEN`, so a CodeScene step here is silently
        # inert for exactly the changes that most need reviewing, and
        # CodeScene accepts an upload only for a branch it analyses, which a
        # pull request head is not. `coverage-main.yml` owns both persistent
        # outputs, and the baseline paths are the action's defaults on both
        # sides, so this ratchet reads the baseline that workflow writes.
        #
        # The Python interpreter for the coverage run is pinned by the
        # repository's .python-version file. Slipcover's line accounting
        # differs between interpreter versions (94.30% on 3.12 vs 91.71% on
        # 3.14 for identical source), so this job and coverage-main must
        # resolve the same Python or the ratchet baseline drifts.
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'
          publish-artefact: 'false'
