name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage only for their own local
# ratchet check, in `ci.yml`; they neither publish a report nor contact
# CodeScene.
#
# CodeScene accepts `cs-coverage upload` only for a branch it analyses, which a
# pull request head is not, and a pull request from a fork cannot read
# `secrets.CS_ACCESS_TOKEN` at all. Caches and baselines written on `main` are
# readable by every pull-request run, so the baseline written here is the one
# those ratchet checks compare against.

'on':
  push:
    branches: [main]
  # A dispatch reads the baseline without advancing it: the shared action
  # publishes a new baseline only on a push to `refs/heads/main`, so a manual
  # run can measure this lane without moving the figure it is measuring.
  workflow_dispatch:

# A run in progress is never cancelled. A cancelled publisher abandons both its
# upload and its ratchet baseline write. The group is keyed on the ref alone:
# runs never overlap, and a newer trigger replaces any run still pending, so
# for triggered runs (push and dispatch) the survivor is the newest main and
# uploads land in commit order. A manual re-run of an older main run is an
# operator action: it republishes that commit's coverage and baseline until
# the next push. Keying on the event too would let an earlier dispatch finish
# after a newer push and upload older coverage last. `make test-workflow-contracts` pins this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Coverage upload on main blocks no one's work, so it runs on a
    # GitHub-hosted runner rather than a paid Ubicloud one.
    runs-on: ubuntu-latest
    # The job states its own ceiling, sized on the Ubicloud runs it had before.
    timeout-minutes: 5
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          install-mold: 'true'
      - name: Test and Measure Coverage
        # The same action, format, output path and default baseline files as
        # the pull-request lane, so the figure written here is the figure a
        # pull request is measured against. The action decides by the event
        # whether it writes the baseline or compares with it. The coverage
        # interpreter is pinned by .python-version, as in ci.yml.
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'
          # This job runs on a GitHub-hosted runner, whose cache store the
          # Ubicloud pull-request lane never reads, so a ratchet here could
          # not fail and a save here would never be restored. `never` skips
          # both and hands the figure to `coverage-baseline` below.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
      - name: Check for the CodeScene token
        id: codescene-token
        # The expression is evaluated before the shell runs, so this step reports
        # whether the secret is set while holding nothing in its `env`. No step
        # here binds the token in `env`: the upload action is composite and would
        # hand a step `env` to its nested `upload-artifact` and cache steps, so
        # the upload passes the secret as its `access-token` input instead.
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # An unset secret leaves the upload out rather than failing the lane.
        # The ref conjunct is what keeps the dispatch trigger above from
        # uploading a branch CodeScene does not analyse: the push trigger is
        # restricted to `main`, but a dispatch may name any branch.
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          path: coverage.xml
          format: cobertura
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

  # Ratchets the figure `coverage-upload` handed over and saves the baseline
  # the Ubicloud pull-request lane restores. It runs only if the coverage job
  # passed, so the baseline never advances from a failed run, and it compiles
  # nothing. It carries no `if`: the action publishes only from a push.
  coverage-baseline:
    needs: coverage-upload
    # The estate's selection expression, as ci.yml writes it: this
    # repository's placement contract requires it of every Ubicloud lane,
    # though a push-only workflow can never take the hosted arm.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          artefact-name: coverage-baseline-handover
